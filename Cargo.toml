[package]
name = "tur-rs"
version = "0.8.2"
edition = "2024"
authors = ["Syed Ali"]
description = "A relentless, high-concurrency download manager built for speed and efficiency. Tur uses dynamic work-stealing and aligned storage to saturate your bandwidth while maintaining a minuscule memory footprint. Inspired by the legends, built for the modern Rust ecosystem."
license = "GPL-3.0-only"
readme = "README.md"
repository = "https://github.com/greykaizen/tur-rs"
homepage = "https://github.com/greykaizen/tur-rs"
categories = ["command-line-utilities", "network-programming"]
keywords = ["download", "manager", "fast", "concurrency", "rust"]

[[bin]]
name = "tur"
path = "src/main.rs"

[features]
default = ["tui"]
linux-io-uring-experimental = []
tui = ["ratatui", "crossterm", "indicatif"]
http3 = ["quinn", "h3", "h3-quinn", "rustls", "webpki-roots"]

[dependencies]
anyhow = "1.0.102"
bincode = "1.3.3"
bytes = "1.11.1"
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive"] }
crossterm = { version = "0.29.0", optional = true }
futures-util = "0.3.32"
http = "1.3.1"
http-body-util = "0.1.3"
hyper = { version = "1.9.0", features = ["client", "http1", "http2"] }
hyper-rustls = { version = "0.27.9", features = ["http1", "http2", "native-tokio", "tls12", "webpki-roots"] }
hyper-util = { version = "0.1.20", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
indicatif = { version = "0.18.4", optional = true }
ratatui = { version = "0.30.0", optional = true }
rustix = { version = "1.1.4", features = ["fs", "pipe"] }
serde = { version = "1.0.228", features = ["derive"] }
socket2 = { version = "0.6.3", features = ["all"] }
sysinfo = { version = "0.30", default-features = false }
tokio = { version = "1.52.2", features = ["fs", "full", "io-util", "rt-multi-thread"] }
tower-service = "0.3.3"
url = "2.5.7"
uuid = { version = "1.23.1", features = ["v4", "serde"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Networking_WinSock"] }

[target.'cfg(target_os = "linux")'.dependencies]
tokio-uring = "0.5"

[dependencies.quinn]
version = "0.11"
optional = true
features = ["runtime-tokio", "rustls-ring"]

[dependencies.h3]
version = "0.0"
optional = true

[dependencies.h3-quinn]
version = "0.0"
optional = true

[dependencies.rustls]
version = "0.23"
optional = true
features = ["ring"]

[dependencies.webpki-roots]
version = "0.26"
optional = true
