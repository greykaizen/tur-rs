[package]
name = "tur"
version = "0.0.1"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
bincode = "1.3.3"
bytes = "1.11.1"
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
futures-util = "0.3.32"
indicatif = "0.18.4"
ratatui = "0.30.0"
reqwest = { version = "0.13.3", features = ["rustls", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.2", features = ["fs", "full", "io-util", "rt-multi-thread"] }
uuid = { version = "1.23.1", features = ["v4", "serde"] }
